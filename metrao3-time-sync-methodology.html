<title>Metrao3 Time-Sync Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF;
  --ground:#E7EAEC;
  --tint:#F2F5F6;
  --ink:#0E1A24;
  --ink-2:#4A5B68;
  --ink-3:#8A99A3;
  --rule:#D3DADE;
  --time:#0E7A54;
  --data:#0B5C8A;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.stage{padding:22px 14px;display:flex;justify-content:center}
.page{
  width:273mm;height:186mm;flex:none;background:var(--paper);
  transform-origin:top center;
  box-shadow:0 1px 2px rgba(14,26,36,.10),0 10px 34px rgba(14,26,36,.13);
  padding:12mm 13mm 9mm;display:flex;flex-direction:column;overflow:hidden;
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-bottom:1.5px solid var(--ink);padding-bottom:9px}
.kicker{font-family:var(--mono);font-size:8.4px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
h1{font-size:27px;line-height:1;letter-spacing:-.025em;font-weight:700;margin:0}
h1 span{color:var(--time)}
.sub{font-size:12px;line-height:1.4;color:var(--ink-2);margin:0;text-align:right;max-width:46ch}
.sub b{color:var(--ink);font-weight:600}
.art{flex:1;display:flex;align-items:center;min-height:0;padding-top:4px}
svg{display:block;width:100%;height:auto}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff}
  .stage{padding:0;display:block}
  .page{width:auto;height:auto;box-shadow:none;padding:0;transform:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<div class="stage"><div class="page">
  <header class="head">
    <div>
      <div class="kicker">Metrao3 &middot; distributed acoustic measurement</div>
      <h1>Time Sync <span>Through GPS</span></h1>
    </div>
    <p class="sub">Every node takes its time from the <b>same satellite clock</b>.<br>
      The network only moves data &mdash; it never carries the timing.</p>
  </header>
  <div class="art">
    <svg id="art" viewBox="0 0 1120 640" role="img"
      aria-label="Concept diagram. A GPS satellite at the top broadcasts a one-pulse-per-second signal, shown as dashed green lines fanning down to four measurement nodes standing in a row, each with a microphone. Each node connects downward by a solid blue line into a single cloud, over a different link: LAN, Wi-Fi, UMTS and LAN. Time comes from the satellite; data goes to the cloud."></svg>
  </div>
</div></div>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function el(n, a, t) {
    var e = document.createElementNS(NS, n);
    for (var k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
    if (t !== undefined) e.textContent = t;
    return e;
  }
  function cv(x) { return getComputedStyle(document.documentElement).getPropertyValue(x).trim(); }
  var INK = cv("--ink"), INK2 = cv("--ink-2"), INK3 = cv("--ink-3");
  var RULE = cv("--rule"), TINT = cv("--tint"), PAPER = cv("--paper");
  var TIME = cv("--time"), DATA = cv("--data");
  var MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  var SANS = '"Archivo", Helvetica, Arial, sans-serif';
  var s = document.getElementById("art");

  function T(x, y, str, o) {
    o = o || {};
    var t = el("text", { x: x, y: y, fill: o.fill || INK2,
      "font-family": o.sans ? SANS : MONO, "font-size": o.size || 12,
      "font-weight": o.w || 400, "text-anchor": o.a || "start",
      "letter-spacing": o.ls || 0 }, str);
    if (o.halo) { t.setAttribute("paint-order", "stroke"); t.setAttribute("stroke", PAPER);
      t.setAttribute("stroke-width", 5); t.setAttribute("stroke-linejoin", "round"); }
    s.appendChild(t); return t;
  }
  function arrow(x, y, ang, col, sz) {
    sz = sz || 7;
    var p = el("polygon", { points: "0," + sz + " " + (-sz * 0.62) + "," + (-sz * 0.7) +
      " " + (sz * 0.62) + "," + (-sz * 0.7), fill: col,
      transform: "translate(" + x + "," + y + ") rotate(" + ang + ")" });
    s.appendChild(p);
  }

  var SAT = { x: 560, y: 74 };
  var NODES = [
    { x: 138, name: "NODE 1", link: "wired LAN" },
    { x: 419, name: "NODE 2", link: "Wi-Fi" },
    { x: 701, name: "NODE 3", link: "UMTS" },
    { x: 982, name: "NODE 4", link: "wired LAN" }
  ];
  var MIC_TOP = 288, MIC_H = 34, BOX_Y = 352, BOX_W = 168, BOX_H = 74;
  var CLOUD = { x: 560, y: 534 };

  /* ---------- satellite ---------- */
  (function () {
    var g = el("g", {});
    // solar panels
    [-1, 1].forEach(function (d) {
      var px = SAT.x + d * 40, w = 62, h = 32;
      var x0 = d < 0 ? px - w : px;
      g.appendChild(el("line", { x1: SAT.x + d * 24, y1: SAT.y, x2: px, y2: SAT.y,
        stroke: INK, "stroke-width": 3 }));
      g.appendChild(el("rect", { x: x0, y: SAT.y - h / 2, width: w, height: h,
        fill: TINT, stroke: INK, "stroke-width": 2.4 }));
      for (var i = 1; i < 3; i++)
        g.appendChild(el("line", { x1: x0 + w * i / 3, y1: SAT.y - h / 2,
          x2: x0 + w * i / 3, y2: SAT.y + h / 2, stroke: INK, "stroke-width": 1.4 }));
    });
    // body
    g.appendChild(el("rect", { x: SAT.x - 24, y: SAT.y - 26, width: 48, height: 52, rx: 6,
      fill: PAPER, stroke: INK, "stroke-width": 2.8 }));
    g.appendChild(el("rect", { x: SAT.x - 13, y: SAT.y - 15, width: 26, height: 12, rx: 2,
      fill: INK }));
    // downlink horn
    g.appendChild(el("path", { d: "M" + (SAT.x - 15) + " " + (SAT.y + 26) + " L" + (SAT.x + 15) +
      " " + (SAT.y + 26) + " L" + (SAT.x + 9) + " " + (SAT.y + 46) + " L" + (SAT.x - 9) +
      " " + (SAT.y + 46) + " Z", fill: INK }));
    s.appendChild(g);
  })();

  // broadcast arcs
  [30, 48, 66].forEach(function (r, i) {
    var cy = SAT.y + 44, a = 0.72;
    var x0 = SAT.x - r * Math.sin(a), y0 = cy + r * Math.cos(a);
    var x1 = SAT.x + r * Math.sin(a), y1 = y0;
    s.appendChild(el("path", { d: "M" + x0 + " " + y0 + " A" + r + " " + r + " 0 0 0 " + x1 + " " + y1,
      fill: "none", stroke: TIME, "stroke-width": 2.6, "stroke-linecap": "round",
      opacity: 0.85 - i * 0.16 }));
  });

  T(SAT.x + 118, SAT.y - 12, "GPS", { fill: TIME, sans: true, size: 30, w: 700, ls: "-.02em" });
  T(SAT.x + 118, SAT.y + 10, "one clock, shared by every node", { fill: INK2, size: 12 });
  T(SAT.x + 118, SAT.y + 30, "1PPS  ·  ±1–5 µs to UTC", { fill: TIME, size: 12, w: 500 });

  /* ---------- time fan: satellite -> each node ---------- */
  var FAN = { x: SAT.x, y: SAT.y + 122 };
  NODES.forEach(function (n) {
    var tx = n.x, ty = MIC_TOP - 26;
    var ang = Math.atan2(ty - FAN.y, tx - FAN.x);
    var ex = tx - Math.cos(ang) * 12, ey = ty - Math.sin(ang) * 12;
    s.appendChild(el("line", { x1: FAN.x, y1: FAN.y, x2: ex, y2: ey, stroke: TIME,
      "stroke-width": 2.2, "stroke-dasharray": "9 7", "stroke-linecap": "round" }));
    arrow(tx, ty, ang * 180 / Math.PI - 90, TIME, 8);
    // pulse tick partway along
    var t = 0.55, px = FAN.x + (ex - FAN.x) * t, py = FAN.y + (ey - FAN.y) * t;
    s.appendChild(el("rect", { x: px - 4, y: py - 4, width: 8, height: 8, fill: TIME,
      stroke: PAPER, "stroke-width": 2.5, transform: "rotate(45 " + px + " " + py + ")" }));
  });

  /* ---------- nodes ---------- */
  NODES.forEach(function (n) {
    var g = el("g", {});
    // microphone
    g.appendChild(el("rect", { x: n.x - 10, y: MIC_TOP, width: 20, height: MIC_H, rx: 10,
      fill: INK }));
    g.appendChild(el("line", { x1: n.x - 6, y1: MIC_TOP + 11, x2: n.x + 6, y2: MIC_TOP + 11,
      stroke: PAPER, "stroke-width": 1.6 }));
    g.appendChild(el("line", { x1: n.x - 6, y1: MIC_TOP + 20, x2: n.x + 6, y2: MIC_TOP + 20,
      stroke: PAPER, "stroke-width": 1.6 }));
    g.appendChild(el("path", { d: "M" + (n.x - 17) + " " + (MIC_TOP + 24) + " A17 17 0 0 0 " +
      (n.x + 17) + " " + (MIC_TOP + 24), fill: "none", stroke: INK, "stroke-width": 2.4 }));
    g.appendChild(el("line", { x1: n.x, y1: MIC_TOP + 41, x2: n.x, y2: BOX_Y,
      stroke: INK, "stroke-width": 2.4 }));
    // receiver box
    g.appendChild(el("rect", { x: n.x - BOX_W / 2, y: BOX_Y, width: BOX_W, height: BOX_H, rx: 3,
      fill: PAPER, stroke: INK, "stroke-width": 2 }));
    g.appendChild(el("rect", { x: n.x - BOX_W / 2, y: BOX_Y, width: BOX_W, height: 5, fill: TIME }));
    g.appendChild(el("circle", { cx: n.x + BOX_W / 2 - 16, cy: BOX_Y + 26, r: 4.5, fill: TIME }));
    s.appendChild(g);
    T(n.x - BOX_W / 2 + 15, BOX_Y + 32, n.name, { fill: INK, sans: true, size: 15, w: 700 });
    T(n.x - BOX_W / 2 + 15, BOX_Y + 52, "measurement point", { fill: INK3, size: 11 });
    // link chip
    var cw = n.link.length * 6.9 + 20;
    s.appendChild(el("rect", { x: n.x - cw / 2, y: BOX_Y + BOX_H + 12, width: cw, height: 21, rx: 10.5,
      fill: TINT, stroke: RULE, "stroke-width": 1 }));
    T(n.x, BOX_Y + BOX_H + 26.5, n.link, { fill: INK2, size: 11, a: "middle" });
  });

  /* ---------- data flow: each node -> the cloud ---------- */
  var TARGETS = [[498, 516], [527, 484], [590, 484], [621, 512]];
  NODES.forEach(function (n, i) {
    var x0 = n.x, y0 = BOX_Y + BOX_H + 40, tx = TARGETS[i][0], ty = TARGETS[i][1];
    s.appendChild(el("path", { d: "M" + x0 + " " + y0 + " C" + x0 + " " + (y0 + 46) + " " +
      tx + " " + (ty - 46) + " " + tx + " " + ty, fill: "none", stroke: DATA,
      "stroke-width": 2.4, "stroke-linecap": "round" }));
    arrow(tx, ty + 2, 0, DATA, 7.5);
  });

  /* ---------- cloud ---------- */
  (function () {
    var cx = CLOUD.x, cy = CLOUD.y, g = el("g", { fill: DATA, "fill-opacity": .13 });
    g.appendChild(el("rect", { x: cx - 74, y: cy + 2, width: 148, height: 36, rx: 18 }));
    g.appendChild(el("circle", { cx: cx - 45, cy: cy + 6, r: 29 }));
    g.appendChild(el("circle", { cx: cx - 4, cy: cy - 17, r: 43 }));
    g.appendChild(el("circle", { cx: cx + 43, cy: cy + 2, r: 33 }));
    s.appendChild(g);
    T(cx, cy + 14, "CLOUD", { fill: DATA, sans: true, size: 24, w: 700, a: "middle", ls: ".02em" });
    T(cx + 96, cy + 2, "one broker", { fill: DATA, size: 13, w: 500 });
    T(cx + 96, cy + 22, "all measurement data", { fill: INK2, size: 12.5 });
  })();

  /* ---------- legend ---------- */
  (function () {
    var y = 628;
    s.appendChild(el("line", { x1: 0, y1: y - 7, x2: 46, y2: y - 7, stroke: TIME,
      "stroke-width": 2.6, "stroke-dasharray": "9 7", "stroke-linecap": "round" }));
    T(56, y - 2.5, "TIME  —  down from GPS, identical at every node", { fill: INK2, size: 11.5 });
    s.appendChild(el("line", { x1: 596, y1: y - 7, x2: 642, y2: y - 7, stroke: DATA,
      "stroke-width": 2.6, "stroke-linecap": "round" }));
    T(652, y - 2.5, "DATA  —  up to the cloud, over whatever link a node has", { fill: INK2, size: 11.5 });
  })();

  /* ---------- fit to viewport on screen ---------- */
  var page = document.querySelector(".page"), stage = document.querySelector(".stage");
  function fit() {
    page.style.transform = "none"; stage.style.height = "";
    var avail = stage.clientWidth - 28, w = page.offsetWidth;
    if (w > avail) {
      var k = avail / w;
      page.style.transform = "scale(" + k + ")";
      stage.style.height = (page.offsetHeight * k + 44) + "px";
    }
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("beforeprint", function () { page.style.transform = "none"; });
  addEventListener("afterprint", fit);
})();
</script>
